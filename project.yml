name: CameraControl
options:
  bundleIdPrefix: com.bennett
  deploymentTarget:
    macOS: "15.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CameraControl:
    type: application
    platform: macOS
    sources: [CameraControl]
    info:
      path: CameraControl/Info.plist
      properties:
        CFBundleDisplayName: Camera Control
        NSCameraUsageDescription: Camera Control uses your camera so it can add effects to your video.
        LSApplicationCategoryType: public.app-category.video
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Bennett Atwood. MIT License.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennett.CameraControl
        PRODUCT_NAME: Camera Control
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
